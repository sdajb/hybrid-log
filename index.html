<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <title>Hybrid Log</title>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      * { -webkit-tap-highlight-color: transparent; }
      button, a, input, textarea, select { -webkit-tap-highlight-color: transparent; outline: none; font-weight: 500; }
      button { touch-action: manipulation; }
      button, input, textarea, select { border-radius: 2px; }
      [data-round="true"] { border-radius: 999px !important; }
      :root { color-scheme: light dark; }
      body { background: #F5F7FA; }
      html, body { height: 100%; margin: 0; overflow: hidden; }
      #root { height: 100%; }
      * { scrollbar-width: none !important; -ms-overflow-style: none !important; }
      *::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
    </style>
  </head>
  <body style="margin:0;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
